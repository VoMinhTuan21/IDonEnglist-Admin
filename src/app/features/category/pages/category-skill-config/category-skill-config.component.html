<app-box>
  <form
    class="category-skill-config"
    nz-form
    nzLayout="vertical"
    nzGutter="16"
    [formGroup]="form"
    (ngSubmit)="submit()"
  >
    <div nz-row nzGutter="16">
      <div nz-col nzSpan="12">
        <nz-form-item>
          <nz-form-label>Name</nz-form-label>
          <nz-form-control nzErrorTip="Please enter name">
            <input nz-input placeholder="Abcd.." formControlName="name" />
          </nz-form-control>
        </nz-form-item>
      </div>
      <div nz-col nzSpan="12">
        <nz-form-item>
          <nz-form-label>Number of Question</nz-form-label>
          <nz-form-control>
            <nz-input-number
              formControlName="numberOfQuestions"
              nzPlaceHolder="0"
              [nzMin]="0"
              nzDisabled
              [style.width.%]="100"
            ></nz-input-number>
          </nz-form-control>
        </nz-form-item>
      </div>
      <div nz-col nzSpan="12">
        <nz-form-item>
          <nz-form-label>Duration (minutes)</nz-form-label>
          <nz-form-control>
            <nz-input-number
              formControlName="duration"
              nzPlaceHolder="0"
              [nzMin]="0"
              nzDisabled
              [style.width.%]="100"
            ></nz-input-number>
          </nz-form-control>
        </nz-form-item>
      </div>
      <div nz-col nzSpan="12">
        <nz-form-item>
          <nz-form-label>Category - Skill</nz-form-label>
          <nz-form-control>
            <input nz-input formControlName="categorySkill" />
          </nz-form-control>
        </nz-form-item>
      </div>
      <div nz-col nzSpan="24" formArrayName="parts">
        <nz-form-item>
          <nz-form-label>Parts</nz-form-label>
          <nz-form-control>
            <nz-table
              class="parts-table"
              #editRowTable
              [nzShowPagination]="false"
              [nzBordered]="true"
              [nzData]="parts.controls.length ? [1] : []"
            >
              <thead>
                <tr>
                  <th [width]="'40%'">Name</th>
                  <th [width]="'25%'">Number of questions</th>
                  <th [width]="'25%'">Duration (minutes)</th>
                  <th [width]="'10%'" nzAlign="center">
                    <button
                      nz-button
                      nzType="primary"
                      nz-tooltip
                      nzTooltipTitle="Add a new part"
                      (click)="addPart()"
                    >
                      <nz-icon nzType="plus-circle" nzTheme="outline" />
                    </button>
                  </th>
                </tr>
              </thead>
              <tbody>
                @for(part of parts.controls; track part.value.id) {
                <tr class="editable-row" [formGroupName]="$index">
                  <td>
                    <nz-form-control nzErrorTip="Please enter part name">
                      <input
                        class="editable-cell"
                        placeholder="Part name..."
                        nz-input
                        type="text"
                        formControlName="name"
                      />
                    </nz-form-control>
                  </td>
                  <td>
                    <nz-form-control
                      nzErrorTip="Please enter number of questions"
                    >
                      <nz-input-number
                        class="editable-cell"
                        nzPlaceHolder="1"
                        [nzMin]="0"
                        formControlName="numberOfQuestions"
                      />
                    </nz-form-control>
                  </td>
                  <td>
                    <nz-form-control nzErrorTip="Please enter duration">
                      <nz-input-number
                        class="editable-cell"
                        nzPlaceHolder="1"
                        [nzMin]="0"
                        formControlName="duration"
                      />
                    </nz-form-control>
                  </td>
                  <td nzAlign="center">
                    <button
                      [hidden]="parts.controls.length === 1"
                      nz-button
                      nzType="default"
                      nzDanger
                      nz-popconfirm
                      nzPopconfirmTitle="Are you sure to delete this part?"
                      (nzOnConfirm)="removePart($index)"
                    >
                      <nz-icon nzType="delete" nzTheme="outline" />
                    </button>
                  </td>
                </tr>
                }
              </tbody>
            </nz-table>
          </nz-form-control>
        </nz-form-item>
      </div>
      <div nz-col nzSpan="24">
        <div nz-flex nzJustify="end" nzGap="16px">
          <a nz-button nzType="default" type="button" routerLink="/category"><nz-icon nzType="arrow-left" nzTheme="outline" />Back</a>
          <button nz-button nzType="primary">
            Save
          </button>
        </div>
      </div>
    </div>
  </form>
</app-box>
