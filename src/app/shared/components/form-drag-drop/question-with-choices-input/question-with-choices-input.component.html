<div nz-flex class="question-with-choices">
  <button nz-button nzType="text" type="button" nz-dropdown [nzDropdownMenu]="menu" class="question-with-choices--left">
    {{ label }}
    <span nz-icon nzType="down"></span>
  </button>
  <nz-dropdown-menu #menu="nzDropdownMenu">
    <ul nz-menu>
      <li
        nz-menu-item
        nz-popconfirm
        nzPopconfirmTitle="Are you sure delete this question?"
        (nzOnConfirm)="confirmDeleteQuestion()"
      >
        <span nz-icon nzType="delete" nzTheme="outline"></span> Delete
      </li>
      <li nz-menu-item (click)="handleAddOption()">
        <span nz-icon nzType="plus" nzTheme="outline"></span> Add option
      </li>
    </ul>
  </nz-dropdown-menu>
  <div class="question-with-choices--right">
    <div [formGroup]="formGroup" class="question-with-choices">
      <nz-form-item>
        <nz-form-control nzErrorTip="This field is required">
          <input nz-input formControlName="text" />
        </nz-form-control>
      </nz-form-item>
      <div formArrayName="choices">
        @for (item of formGroupControls[1].items; track choiceIndex; let
        choiceIndex = $index) {
        <div
          [formGroupName]="choiceIndex"
          nz-flex
          nzGap="middle"
          class="question-with-choices__option"
        >
          <span class="question-with-choices__option--label">{{
            choiceIndex | numberToChar
          }}</span>
          <div class="question-with-choices__option--input">
            <nz-form-item>
              <nz-form-control nzErrorTip="This field is required" >
                <input nz-input formControlName="text" />
              </nz-form-control>
            </nz-form-item>
          </div>
          <span nz-tooltip nzTooltipTitle="Mark as Answer">
            <label nz-checkbox formControlName="markAsAnswer"></label>
          </span>
          <button
            nz-button
            nzDanger
            nz-popconfirm
            nzPopconfirmTitle="Are you sure delete this option?"
            nzPopconfirmPlacement="bottom"
            (nzOnConfirm)="handleRemoveOption(choiceIndex)"
          >
            <span nz-icon nzType="delete" nzTheme="outline"></span>
          </button>
        </div>
        }
      </div>
    </div>
  </div>
</div>
