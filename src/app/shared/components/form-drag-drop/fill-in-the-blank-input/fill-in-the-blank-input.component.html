<div nz-flex class="fill-in-the-blank-question">
  <button nz-button nzType="text" type="button" nz-dropdown [nzDropdownMenu]="menu" class="fill-in-the-blank-question--left">
    {{ label }}
    <span nz-icon nzType="down"></span>
  </button>
  <nz-dropdown-menu #menu="nzDropdownMenu">
    <ul nz-menu>
      <li
        nz-menu-item
        nz-popconfirm
        nzPopconfirmTitle="Are you sure delete this question?"
        (nzOnConfirm)="confirmDeleteQuestion()"
      >
        <span nz-icon nzType="delete" nzTheme="outline"></span> Delete
      </li>
    </ul>
  </nz-dropdown-menu>
  <div class="fill-in-the-blank-question--right">
    <app-fill-in-blank-text-editor
      [ngModel]="value"
      (ngModelChange)="onInput($event)"
      [numOfBlanks]="1"
      [shouldValidate]="shouldValidate"
    ></app-fill-in-blank-text-editor>
  </div>
</div>
